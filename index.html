<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Travel Planner</title>
    <link rel="stylesheet" href="style.css">
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>

    <!-- HERO HEADER -->
    <div class="hero">
        <div style="position: absolute; top: 15px; right: 20px; display: flex; gap: 10px;">
            <button class="lang-switch" onclick="toggleDarkMode()" id="dark-btn">🌙</button>
            <button class="lang-switch" onclick="toggleLang()">FR / EN</button>
        </div>
        <h1 id="txt-title">Explorez le monde ✈️</h1>
        <p id="txt-subtitle">Préparez votre itinéraire sur-mesure</p>
    </div>

    <!-- BARRE DE CONFIGURATION -->
    <div class="search-bar">
        <div>
            <label id="lbl-start" style="font-size:0.7rem; font-weight:bold; display:block;">DÉPART</label>
            <input type="text" id="cityStart" placeholder="Ex: Paris" oninput="handleSearch(this.value, 'start')">
            <div id="suggestionsStart" class="suggest-box" style="display:none;"></div>
        </div>
        <div>
            <label id="lbl-end" style="font-size:0.7rem; font-weight:bold; display:block;">ARRIVÉE</label>
            <input type="text" id="cityEnd" placeholder="Ex: Rome" oninput="handleSearch(this.value, 'end')">
            <div id="suggestionsEnd" class="suggest-box" style="display:none;"></div>
        </div>
        <div>
            <label id="lbl-from" style="font-size:0.7rem; font-weight:bold; display:block;">DU</label>
            <input type="date" id="dateStart" onchange="initDates()">
        </div>
        <div>
            <label id="lbl-to" style="font-size:0.7rem; font-weight:bold; display:block;">AU</label>
            <input type="date" id="dateEnd" onchange="generateTimeline()">
        </div>
        <div>
            <label id="lbl-cur" style="font-size:0.7rem; font-weight:bold; display:block;">DEVISE</label>
            <select id="currency" onchange="saveAndRefresh()">
                <option value="€">€ (EUR)</option>
                <option value="$">$ (USD)</option>
                <option value="£">£ (GBP)</option>
            </select>
        </div>
        <div>
            <label id="lbl-pax" style="font-size:0.7rem; font-weight:bold; display:block;">VOYAGEURS</label>
            <input type="number" id="pax" value="1" min="1" style="width:50px;" onchange="saveAndRefresh()">
        </div>
        <div>
            <label style="font-size:0.7rem; font-weight:bold; display:block;">POLARSTEPS</label>
            <input type="url" id="polarstepsUrl" placeholder="Lien Polarsteps" onchange="saveAndRefresh()" style="width:130px;">
            <a id="btnPolarsteps" href="#" target="_blank" style="display:none; font-size:0.8rem; text-decoration:none; margin-left:5px;">📍 Voir</a>
        </div>
    </div>

    <!-- CONTENEUR PRINCIPAL -->
    <div class="main-container">
        
        <!-- COLONNE GAUCHE : TIMELINE & ACTIONS -->
        <div class="column">
            <div class="timeline scrollable">
                <h3 style="margin-top:0;">🗓️ Itinéraire</h3>
                <div id="timelineArea"></div>
                
                <hr style="border:0; border-top:1px solid var(--border-color); margin:20px 0;">
                
                <div class="btn-group">
                    <button class="btn-main" onclick="clearAll()" style="background: #ef4444;">🗑️ Tout effacer</button>
                    <button class="btn-main" onclick="downloadData()" style="background: #3b82f6;">💾 Sauvegarder</button>
                    <button class="btn-main" onclick="toggleFocus()" style="background: #64748b;">
                        <span id="focus-icon">🔼</span> 
                        <span id="focus-text">Masquer l'en-tête</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- COLONNE CENTRALE : PLANIFICATEUR DU JOUR -->
        <div class="column scrollable">
            <h2 id="currentDayTitle">Jour 1</h2>
            
            <!-- Ajouter des éléments -->
            <div class="btn-group" style="margin-bottom: 20px;">
                <button class="btn-main btn-vol" onclick="addBlock('vol')">✈️ + <span class="t-vol">Vol / Transport</span></button>
                <button class="btn-main btn-hotel" onclick="addBlock('hotel')">🏨 + <span class="t-hotel">Hôtel</span></button>
                <button class="btn-main btn-activ" onclick="findActivities()">🎟️ + <span class="t-activ">Activité</span></button>
                <button class="btn-main btn-resto" onclick="findRestaurants()">🍴 + <span class="t-resto">Restaurant</span></button>
            </div>

            <!-- Moteur de recherche d'Activités & Restaurants -->
            <div id="resto-results" style="display:none; background:var(--card-bg); border:1px solid var(--resto-color); border-radius:15px; padding:15px; margin-bottom:20px;">
                <div style="display:flex; justify-space:between; align-items:center; margin-bottom:10px;">
                    <h4 style="margin:0; color:var(--resto-color);" id="search-results-title">🍴 Suggestions à proximité</h4>
                    <button onclick="document.getElementById('resto-results').style.display='none'" style="border:none; background:none; cursor:pointer; color:var(--text-main);">✕</button>
                </div>
                
                <!-- Filtres -->
                <div id="resto-filters" style="display:flex; gap:5px; margin-bottom:12px; overflow-x:auto; padding-bottom:5px;">
                    <button class="btn-api" onclick="findRestaurants('all')" style="background:var(--resto-color); color:white; width:auto;">Tous Restos</button>
                    <button class="btn-api" onclick="findRestaurants('pizza|italian')" style="width:auto;">🇮🇹 Italien</button>
                    <button class="btn-api" onclick="findRestaurants('burger|fast_food')" style="width:auto;">🍔 Fast-Food</button>
                    <button class="btn-api" onclick="findRestaurants('cafe|bakery')" style="width:auto;">☕ Café</button>
                </div>

                <div id="resto-list" style="display:grid; gap:8px;"></div>
            </div>

            <!-- Liste des événements du jour -->
            <div id="blocksList"></div>
        </div>

        <!-- COLONNE DROITE : BUDGET, EQUILIBRE & CARTE -->
        <div class="column sidebar">
            <!-- CARTE BUDGET -->
            <div class="budget-card">
                <small id="txt-total-lbl">TOTAL DU VOYAGE</small>
                <h1 id="totalLabel" style="margin:5px 0;">0€</h1>
                <div style="font-size:0.8rem; opacity:0.9;">
                    <span id="txt-budget-lbl">Budget estimé :</span> 
                    <input type="number" id="budgetMax" style="width:70px; background:rgba(255,255,255,0.2); border:none; color:white; font-weight:bold; text-align:center;" oninput="saveAndRefresh()">
                    <span class="cur-symbol">€</span>
                </div>
                <div id="alertLimit" style="display:none; color:#fca5a5; font-weight:bold; font-size:0.8rem; margin-top:5px;">⚠️ Budget dépassé !</div>
            </div>

            <!-- RÉCAPITULATIF PAR CATÉGORIE & ÉQUILIBRE DES COMPTES -->
            <div class="timeline recap-card">
                <div id="recap-list" style="display:grid; gap:8px;"></div>
                
                <hr style="border:0; border-top:1px solid var(--border-color); margin:15px 0;">
                
                <h4 style="margin:0 0 10px 0; color:var(--text-main);">⚖️ Équilibre des comptes</h4>
                <div id="split-summary" style="display:grid; gap:6px; font-size:0.85rem;"></div>

                <button class="btn-main" id="btn-pdf" onclick="exportPDF()" style="background:#10b981; margin-top:15px;">📄 Télécharger en PDF</button>
            </div>

            <!-- CARTE LEAFLET -->
            <div id="map"></div>
        </div>

    </div>

    <!-- Scripts CDN -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
